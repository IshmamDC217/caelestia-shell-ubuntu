# Hyprland + Caelestia Shell on Ubuntu 26.04 LTS
# Self-contained: does not source any external dotfile tree.
# Wiki: https://wiki.hypr.land/

################
### MONITORS ###
################

# Auto-detect. Use `nwg-displays` to generate ~/.config/hypr/monitors.conf,
# then uncomment the source line below.
monitor = , preferred, auto, auto
# source = ~/.config/hypr/monitors.conf

#################
### PROGRAMS  ###
#################

$terminal    = kitty
$fileManager = nautilus
$browser     = firefox

#############################
### ENVIRONMENT VARIABLES ###
#############################

# Required: Quickshell installs its QML modules here.
env = QML_IMPORT_PATH,/usr/lib/qt6/qml

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = MOZ_ENABLE_WAYLAND,1

#################
### AUTOSTART ###
#################

exec-once = systemctl --user start hyprpolkitagent
exec-once = swayosd-server
exec-once = caelestia shell -d

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(45475aaa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsOut, 1, 1.49, easeOutQuint, popin 87%
    animation = fade, 1, 3.03, easeOutQuint
    animation = workspaces, 1, 1.94, easeOutQuint, slide
    animation = layers, 1, 3.81, easeOutQuint
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vfr = true
}

#############
### INPUT ###
#############

input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

# Touchpad workspace swipe (0.51+ replaced the `gestures {}` block)
gesture = 3, horizontal, workspace

####################
### KEYBINDINGS  ###
####################

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, E, exec, $fileManager
bind = $mod, B, exec, $browser
bind = $mod, V, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, M, exit,

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

##############################
### CAELESTIA GLOBAL BINDS ###
##############################
# Caelestia exposes its actions as Hyprland D-Bus global shortcuts
# under the appid `caelestia`. Syntax: global, <appid>:<name>

bind = $mod, Space,       global, caelestia:launcher
bind = $mod, D,           global, caelestia:dashboard
bind = $mod, S,           global, caelestia:sidebar
bind = $mod, U,           global, caelestia:utilities
bind = $mod, N,           global, caelestia:nexus
bind = $mod, Tab,         global, caelestia:showall
bind = $mod SHIFT, N,     global, caelestia:clearNotifs
bind = $mod SHIFT, L,     global, caelestia:lock
bind = $mod SHIFT, S,     global, caelestia:screenshotFreeze
bind = $mod SHIFT, C,     global, caelestia:screenshotFreezeClip
bind = , Print,           global, caelestia:screenshot
bind = SHIFT, Print,      global, caelestia:screenshotClip

# Media / brightness (Caelestia renders the OSD)
bindl  = , XF86AudioPlay,        global, caelestia:mediaToggle
bindl  = , XF86AudioNext,        global, caelestia:mediaNext
bindl  = , XF86AudioPrev,        global, caelestia:mediaPrev
bindl  = , XF86AudioStop,        global, caelestia:mediaStop
bindel = , XF86MonBrightnessUp,   global, caelestia:brightnessUp
bindel = , XF86MonBrightnessDown, global, caelestia:brightnessDown

# Volume via swayosd
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl  = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle

####################
### WINDOW RULES ###
####################

windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

windowrule {
    name = float-config-tools
    match:class = ^(nwg-displays|nwg-look|qt6ct|qt5ct|pavucontrol|blueman-manager)$

    float = true
}
