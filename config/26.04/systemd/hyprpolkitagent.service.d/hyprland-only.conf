# Ubuntu's hyprpolkitagent package enables the unit globally for
# graphical-session.target, so it also starts under GNOME (next to GNOME's own
# polkit agent) and crash-loops when Hyprland exits. Tie it to the Hyprland
# session instead, and skip it whenever no live Hyprland is listening.
[Unit]
PartOf=hyprland-session.target
After=hyprland-session.target

[Service]
ExecCondition=/bin/sh -c 'timeout 3 /usr/bin/hyprctl version >/dev/null 2>&1'
